max_ad_sales_growth_fraction: 0.05  # R6, ASSUMPTION, inclusive upper bound
organic_decline_transitions: 3    # R8, ASSUMPTION, four consecutive weeks
maturity_break_even_fraction: 0.80  # R9, ASSUMPTION
