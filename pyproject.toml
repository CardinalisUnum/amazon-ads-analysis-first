[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "adsreport"
version = "0.1.0"
description = "Analysis-first weekly Amazon Ads reporting proof of concept"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = ["pydantic==2.14.3", "PyYAML==6.0.3"]

[project.scripts]
adsreport = "adsreport.cli:main"

[dependency-groups]
dev = [
  "hypothesis==6.170.15",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.5",
  "types-PyYAML==6.0.12.20261113",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adsreport"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".tools", "output", "reports", "research_notes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["adsreport"]
branch = true

[tool.coverage.report]
show_missing = true
