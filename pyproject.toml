[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "adsreport"
version = "0.1.0"
description = "Analysis-first weekly Amazon Ads reporting proof of concept"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "google-genai==3.3.0",
    "jinja2==3.1.6",
    "matplotlib==3.11.2",
    "pydantic==2.14.3",
    "python-pptx==1.0.2",
    "PyYAML==6.0.3",
    "weasyprint==70.0",
    "xlsxwriter==3.3.1",
]

[project.scripts]
adsreport = "adsreport.cli:main"

[dependency-groups]
dev = [
  "hypothesis==6.170.15",
  "mypy==2.4.1",
  "openpyxl==3.1.5",
  "pypdf==7.1.0",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.5",
  "types-PyYAML==6.0.12.20261113",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adsreport"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".tools", "output", "reports", "research_notes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "adsreport.render.pptx"
# python-pptx 1.0.2 exposes some unannotated chart/color constructors.
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["adsreport"]
branch = true

[tool.coverage.report]
show_missing = true
